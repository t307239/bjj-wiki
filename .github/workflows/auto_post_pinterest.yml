name: Auto Post to Pinterest

on:
  schedule:
    - cron: '0 23 * * *'  # 08:00 JST (23:00 UTC 前日)
    - cron: '0 8 * * *'   # 17:00 JST (08:00 UTC)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image dependencies
        run: pip install Pillow

      - name: Generate PNG OG images (incremental)
        run: python3 scripts/gen_og_png.py --lang en --incremental

      - name: Post to Pinterest
        env:
          PINTEREST_APP_ID:       ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET:   ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID:     ${{ secrets.PINTEREST_BOARD_ID }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/auto_post_pinterest.py

      - name: Commit posted log + new PNGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add scripts/already_posted_pinterest.txt og-png/ || true
          git diff --staged --quiet || git commit -m "Auto: update Pinterest posted log + PNGs $(date '+%Y-%m-%d %H:%M')"
          git push || true

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Pinterest auto post failed $(date '+%Y-%m-%d %H:%M')"
