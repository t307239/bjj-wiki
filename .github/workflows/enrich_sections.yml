name: Enrich Wiki Sections (FAQ + Difficulty)

on:
  schedule:
    - cron: '0 2 * * *'  # 毎日 11:00 JST（generate.yml 完了後に実行）
  workflow_dispatch:
    inputs:
      lang:
        description: '言語 (en/ja/pt)'
        required: false
        default: 'ja'
      limit:
        description: '処理ページ数'
        required: false
        default: '1600'

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine language (auto-rotate by day-of-week)
        id: lang
        run: |
          if [ -n "${{ github.event.inputs.lang }}" ]; then
            echo "lang=${{ github.event.inputs.lang }}" >> $GITHUB_OUTPUT
          else
            DOW=$(date +%u)
            case $DOW in
              1|2|3) LANG="ja" ;;
              4|5|6) LANG="en" ;;
              7)     LANG="pt" ;;
            esac
            echo "lang=$LANG" >> $GITHUB_OUTPUT
          fi

      - name: Run enrich_sections.py
        id: enrich
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '1600' }}"
          python scripts/enrich_sections.py --lang "${{ steps.lang.outputs.lang }}" --limit "$LIMIT" 2>&1 | tee /tmp/enrich.log
          # 最終行から結果を抽出
          SUCCESS=$(grep -oP 'Success: \K\d+' /tmp/enrich.log || echo "0")
          FAILED=$(grep -oP 'Failed:\s+\K\d+' /tmp/enrich.log || echo "0")
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          # ── 完了検知: "All done!" が出力されたら該当言語の完了フラグを立てる ──
          if grep -q "All done" /tmp/enrich.log; then
            echo "all_done=true" >> $GITHUB_OUTPUT
          else
            echo "all_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          CHANGED=$(git diff --cached --numstat | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            git commit -m "wiki: enrich FAQ+Difficulty ${{ steps.lang.outputs.lang }} — ${{ steps.enrich.outputs.success }} pages"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit"
          fi

      # ── 完了通知: この言語のFAQ+Difficulty注入が全ページ完了したらTelegramで通知 ──
      # "All done!" = find_targets() が空 = 未処理ページ0件
      - name: Notify completion via Telegram
        if: steps.enrich.outputs.all_done == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LANG="${{ steps.lang.outputs.lang }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ Wiki FAQ+Difficulty 注入完了 [$LANG] $(date '+%Y-%m-%d') — 全ページ処理済み！"

      - name: Job Summary
        if: always()
        run: |
          echo "## Wiki Enrich Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Language | \`${{ steps.lang.outputs.lang }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Success | ${{ steps.enrich.outputs.success }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${{ steps.enrich.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| All Done | ${{ steps.enrich.outputs.all_done }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
