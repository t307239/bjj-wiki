name: Enrich Wiki Sections (FAQ + Difficulty)

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 10:00 JST
  workflow_dispatch:
    inputs:
      lang:
        description: '言語 (en/ja/pt)'
        required: false
        default: 'ja'
      limit:
        description: '処理ページ数'
        required: false
        default: '1600'

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine language (auto-rotate by day-of-week)
        id: lang
        run: |
          if [ -n "${{ github.event.inputs.lang }}" ]; then
            echo "lang=${{ github.event.inputs.lang }}" >> $GITHUB_OUTPUT
          else
            DOW=$(date +%u)
            case $DOW in
              1|2|3) LANG="ja" ;;
              4|5|6) LANG="en" ;;
              7)     LANG="pt" ;;
            esac
            echo "lang=$LANG" >> $GITHUB_OUTPUT
          fi

      - name: Run enrich_sections.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '1600' }}"
          python scripts/enrich_sections.py --lang "${{ steps.lang.outputs.lang }}" --limit "$LIMIT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          CHANGED=$(git diff --cached --numstat | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            git commit -m "wiki: enrich FAQ+Difficulty ${{ steps.lang.outputs.lang }} — auto batch"
            git push
          else
            echo "No changes to commit"
          fi
