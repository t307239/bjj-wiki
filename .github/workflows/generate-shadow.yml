name: Shadow Cutover Verification

# 📖 What this is (前置き):
#
# 既存 generate.yml と完全に独立した workflow です。 Production 影響 0:
#   - 既存 wiki page を一切上書きしない
#   - Gemini API を呼ばない (cost 0)
#   - shadow/ directory にも書かない (passive shadow、template の verify のみ)
#   - production の {lang}/*.html、generate.yml、その他 production scripts には触らない
#
# 何をするか:
#   1. EN/JA/PT で 30 page ずつ random sample
#   2. extract → render → diff_check で structurally equivalent か verify
#   3. 結果を Telegram に通知
#
# Cutover 可能性の daily check として機能:
#   - 「今日の shadow 結果: 全 locale ✅」 が数日続いたら cutover OK signal
#   - TEMPLATE_GAP > 0 (PT 以外) が出たら → 何かが drift し始めた、要調査
#
# 既存 generate.yml の cron (1 AM UTC) より 30 分後に走る (重ならないよう)

on:
  schedule:
    - cron: '30 1 * * *'  # 10:30 JST、generate.yml の 30 分後
  workflow_dispatch:
    inputs:
      sample:
        description: 'Pages per locale to sample (default: 30)'
        required: false
        default: '30'

jobs:
  shadow:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # production を一切変更しないので read のみで OK
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet jinja2 pyyaml beautifulsoup4

      - name: Run shadow verification
        id: shadow
        run: |
          SAMPLE=${{ github.event.inputs.sample || '30' }}
          mkdir -p /tmp/shadow_out
          python3 scripts/template_engine/shadow_runner.py \
            --sample "$SAMPLE" \
            --output /tmp/shadow_out/report.json \
            --telegram-msg-out /tmp/shadow_out/telegram.txt

      - name: Upload shadow report (artifact, 7 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: shadow-report-${{ github.run_number }}
          path: /tmp/shadow_out/
          retention-days: 7

      - name: Notify Telegram with shadow result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/shadow_out/telegram.txt ]; then
            BODY=$(cat /tmp/shadow_out/telegram.txt)
          else
            BODY="🔴 Shadow run failed before producing report. Check Actions log."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${BODY}"

      - name: Job Summary
        if: always()
        run: |
          echo "## Shadow Cutover Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/shadow_out/telegram.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/shadow_out/telegram.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
