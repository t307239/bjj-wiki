name: News Page Weekly Update

# Wave WW (G): /news weekly freshness signal
# Re-renders en/news.html, ja/news.html, pt/news.html every Monday 09:00 JST
# from data/news_feed.yml. Bumps "week of YYYY-MM-DD" stamp + rotates
# featured_techniques pool window. Provides Google a freshness signal even
# if no manual content updates happen.

on:
  schedule:
    # Mondays 00:00 UTC = 09:00 JST
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Regenerate news pages
        run: python3 scripts/generate_news_page.py

      - name: Regenerate RSS feeds
        run: python3 scripts/generate_news_rss.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/news.html ja/news.html pt/news.html feed.xml feed-ja.xml feed-pt.xml
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi
          WEEK=$(date -u +%Y-%m-%d)
          git commit -m "chore(news): weekly refresh (week of $WEEK) [skip ci]"
          git push
