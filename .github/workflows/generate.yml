name: Generate BJJ Wiki

on:
  # z262idx: 日次自動生成を停止（インデックス止血）。
  # Why: GSC で 616 page (未登録の76%) が「クロール済み/検出-インデックス未登録」=
  #      薄い量産ページがクロールバジェットとサイト評価を圧迫していた (docs/WIKI_INDEXING_DIAGNOSIS.md)。
  #      ページ増加を止め、良質ページへクロールを集中させる。
  #      生成は workflow_dispatch の手動実行のみに限定（品質を確認してから回す運用）。
  # schedule:
  #   - cron: '0 1 * * *'  # 毎朝10:00 JST（5記事ずつ追加）— 停止中
  workflow_dispatch:      # 手動実行のみ（品質ゲート運用）
    inputs:
      limit:
        description: '生成する記事数 (default: 5)'
        required: false
        default: '5'
      force:
        description: 'キャッシュ無視して強制再生成 (true/false)'
        required: false
        default: 'false'
      lang:
        description: '生成する言語 (en/ja/pt/all)'
        required: false
        default: 'all'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # z156: generate 実行前に regression lint (🔴 0 なら PASS)
      # 失敗時は generate をキャンセルして先祖返りした script が
      # 1,400+ ページを上書きするのを防ぐ
      - name: Regression guard (detect_gha_regression.py)
        run: python3 scripts/detect_gha_regression.py --ci

      # 📖 z255bbb (REF-2 cutover Phase 3 — default flipped to NEW pipeline).
      # 旧 z255vv では USE_TEMPLATE_PIPELINE="true" 必須だったが、Phase 1+2 で
      # 全 163 Technique page を新 template に bulk apply 済 → cron も新 pipeline に
      # 切り替えるのが整合的。
      #
      # USE_TEMPLATE_PIPELINE が "false" なら従来通り generate_bjj_wiki.py (rollback path)。
      # それ以外 (unset / "true" / 空) なら新 pipeline (cutover_runner.py)。
      #
      # Rollback: GitHub repo Settings → Variables → USE_TEMPLATE_PIPELINE=false に setting で
      # 即時旧 pipeline に戻る。
      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          LANG=${{ github.event.inputs.lang || 'all' }}
          FORCE=${{ github.event.inputs.force || 'true' }}
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
          if [ "${{ vars.USE_TEMPLATE_PIPELINE }}" = "false" ]; then
            echo "📜 Using legacy pipeline (generate_bjj_wiki.py) — rollback mode"
            python scripts/generate_bjj_wiki.py --limit "$LIMIT" --lang "$LANG" $FORCE_FLAG
          else
            echo "🌟 Using new template-driven pipeline (cutover_runner.py) [DEFAULT after z255bbb]"
            pip install --quiet jinja2 pyyaml beautifulsoup4
            python scripts/template_engine/cutover_runner.py --limit "$LIMIT" --lang "$LANG" $FORCE_FLAG
          fi

      - name: Patch FAQ (inject 3 Q&As into FAQ-less pages)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/patch_faq.py --limit 200 --lang all

      - name: Patch internal links (keyword-match links into link-poor pages)
        run: python scripts/patch_internal_links.py --lang all --min-links 2

      # z175: Inject 3 app-signup CTAs (Top Hero / Bottom / Floating) into all
      # articles. Idempotent — only inserts if `<!-- z175-{top|bottom|float}-cta -->`
      # markers are absent. Source attribution via ?ref=wiki&page={top|bottom|float}.
      - name: Patch funnel CTAs (Wiki → bjj-app.net signup)
        run: python scripts/patch_funnel_cta.py --lang all

      # ── 動画注入: Supabaseのvideo_urlを各HTMLに埋め込む ──
      # total_patched=0 → 全ページ注入済み（完了）
      - name: Inject video iframes from Supabase video_url into HTML files
        id: video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/patch_video_from_supabase.py --lang all 2>&1 | tee /tmp/video.log
          PATCHED=$(grep -oP '\d+(?= ファイル注入)' /tmp/video.log || echo "0")
          SKIPPED=$(grep -oP '\d+(?= スキップ)' /tmp/video.log || echo "0")
          echo "patched=$PATCHED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          # 注入0件 = 全ページ処理済み
          if [ "$PATCHED" = "0" ]; then
            echo "all_done=true" >> $GITHUB_OUTPUT
          else
            echo "all_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate BJJ News page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_bjj_news.py

      - name: Generate athlete profiles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_bjj_athletes.py --limit 2

      - name: Generate gear review pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_gear_reviews.py --limit 2

      - name: Update sitemap lastmod
        run: python scripts/patch_sitemap.py

      - name: Enrich sitemap with hreflang annotations (international SEO)
        run: python scripts/enrich_sitemap_hreflang.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Migrate HTML to Supabase (wiki_pages / wiki_translations)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run migrate

      - name: Score quality (A+C+G - update quality_score / quality_flags)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/score_quality.py

      # z261h: drift 防止 — make verify を commit/deploy 直前に走らせ、
      # lint が 1 つでも fail なら GHA を fail させて drift page が live に
      # 流出しないようにする。Telegram alert で即時通知。
      # CLAUDE.md ルール 0「先祖返り防止プロトコル」の cron 経路 protection。
      - name: Verify quality (drift detection — z261h)
        id: verify
        run: |
          set -o pipefail
          if ! make verify 2>&1 | tee /tmp/verify.log; then
            echo "verify_failed=true" >> $GITHUB_OUTPUT
            echo "::error::make verify failed — drift detected, blocking commit/deploy"
            exit 1
          fi
          echo "verify_failed=false" >> $GITHUB_OUTPUT

      - name: Notify Telegram on drift detection
        if: failure() && steps.verify.outputs.verify_failed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAIL=$(tail -40 /tmp/verify.log 2>/dev/null | head -2000 || echo "(verify.log not found)")
          MSG="🚨 bjj-wiki drift detected $(date '+%Y-%m-%d %H:%M JST')%0A%0AGHA generate.yml の make verify step で drift を検出しました。commit/deploy を block 済み。%0A%0A--- tail of verify.log ---%0A${TAIL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" || true

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: add BJJ articles $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Submit URLs to IndexNow (Bing/Yandex 即時インデックス通知)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/submit_indexnow.py --limit 10000
        continue-on-error: true  # IndexNow 失敗でも記事生成全体は止めない

      # ── 完了通知: 動画注入が全ページ完了したらTelegramで通知 ──
      # patched=0 = 新規注入なし = 全ページ処理済み
      - name: Notify video injection completion via Telegram
        if: steps.video.outputs.all_done == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ Wiki 動画注入 完了 $(date '+%Y-%m-%d') — 全ページ処理済み！（スキップ: ${{ steps.video.outputs.skipped }}件 既存）"

      - name: Job Summary
        if: always()
        run: |
          echo "## Wiki Generate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Video Patched | ${{ steps.video.outputs.patched }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Video Skipped | ${{ steps.video.outputs.skipped }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Video All Done | ${{ steps.video.outputs.all_done }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ BJJ Wiki 自動生成失敗 $(date '+%Y-%m-%d')"
