name: Generate BJJ Wiki

on:
  schedule:
    - cron: '0 1 * * *'  # 毎朝10:00 JST（5記事ずつ追加）
  workflow_dispatch:      # 手動実行も可能
    inputs:
      limit:
        description: '生成する記事数 (default: 5)'
        required: false
        default: '5'
      force:
        description: 'キャッシュ無視して強制再生成 (true/false)'
        required: false
        default: 'false'
      lang:
        description: '生成する言語 (en/ja/pt/all)'
        required: false
        default: 'all'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '5' }}
          LANG=${{ github.event.inputs.lang || 'all' }}
          FORCE=${{ github.event.inputs.force || 'false' }}
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
          python scripts/generate_bjj_wiki.py --limit "$LIMIT" --lang "$LANG" $FORCE_FLAG

      - name: Generate BJJ News page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_bjj_news.py

      - name: Generate athlete profiles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_bjj_athletes.py --limit 2

      - name: Generate gear review pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_gear_reviews.py --limit 2

      - name: Update sitemap lastmod
        run: python scripts/patch_sitemap.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: add BJJ articles $(date '+%Y-%m-%d')"
          git push

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ BJJ Wiki 自動生成失敗 $(date '+%Y-%m-%d')"
