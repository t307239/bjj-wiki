name: GHA Regression Guard

# z156 で追加: z140-z155 で発見した 12 pattern の自動検出
# 以下のいずれかで走り、🔴 Critical があれば fail:
#  - PR open/sync
#  - main に push
#  - 毎朝 9:30 JST (generate.yml = 10:00 JST の前に)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - '.github/workflows/**.yml'
  schedule:
    - cron: '30 0 * * *'  # 09:30 JST — generate.yml (10:00 JST) の前
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GHA regression detection
        id: lint
        run: python3 scripts/detect_gha_regression.py --ci

      - name: Check Wiki locale parity (z176b — 3 locale 不揃い検出)
        id: parity
        run: python3 scripts/check_locale_parity.py --ci

      # z255p: ja/pt static HTML title 英語混入の再発検出
      # z255k で 100 件再発した bug class を catch (GHA migrate-local が DB 上書き)
      - name: Scan JA static HTML for English title regression
        id: scan_ja
        run: python3 scripts/scan_ja_english_mixing.py --ci

      - name: Scan PT static HTML for English title regression
        id: scan_pt
        env:
          CI_THRESHOLD: "50"  # 現状 35 件 false positive、50 超で新規再発と判定
        run: python3 scripts/scan_pt_english_mixing.py --ci

      # z255q: 内部リンクの死活検査 (cross-locale / root-relative / template literal を正しく解決)
      # 旧 check_broken_links.py は filename-only の flat set だったため 41,837 件全部 false positive で silent pass していた。
      # rewrite 後 broken=0、threshold 100 で軽い regression も catch。
      - name: Check internal links for 404
        id: broken_links
        run: python3 scripts/check_broken_links.py --ci

      # z255r: sitemap.xml ↔ disk HTML 整合性 (sitemap → 404 / orphan HTML 検出)
      # noindex redirect と Google Search Console 認証 file は除外。
      - name: Check sitemap drift
        id: sitemap_drift
        run: python3 scripts/check_sitemap_drift.py --ci

      # z255s: hreflang 整合性 (template 未置換 / 404 / self mismatch / locale 欠落)
      - name: Check hreflang validity
        id: hreflang
        run: python3 scripts/check_hreflang_validity.py --ci

      # z255t: JSON-LD structured data validity (rich snippet 死活)
      # parse error / missing @context / @type or @graph 欠落 / template residue を catch
      - name: Check JSON-LD validity
        id: jsonld
        run: python3 scripts/check_jsonld_validity.py --ci

      # z255tt: BreadcrumbList JSON-LD presence (SERP breadcrumb navigation 必須)
      # 旧: 3,853 page で missing → CTR 機会喪失 (z255tt patch_breadcrumb_jsonld.py で fix)
      - name: Check BreadcrumbList JSON-LD presence
        id: breadcrumb
        run: python3 scripts/check_breadcrumb_jsonld.py --ci

      # z255uu: JA/PT page で UI label (category badge / belt / difficulty) の EN 残留 catch
      # 旧: 1,184 JA + 1,242 PT page で <span class="badge">Joint Lock</span> 等が残留
      # (z255uu fix_ui_labels_locale.py で fix。2,786 件 / 2,426 page localized)
      - name: Check UI label locale drift
        id: ui_label
        run: python3 scripts/check_ui_label_locale_drift.py --ci

      # z255ww: lang-switcher 標準 Pattern A (🇺🇸 EN / 🇯🇵 JA / 🇧🇷 PT) 必須
      # 旧: 207 page で switcher 不在 + 6 page Pattern B + 21 page Pattern C
      # = JA user は別 locale 版が存在しても UI で気づけない silent UX bug
      - name: Check lang-switcher format consistency
        id: lang_switcher
        run: python3 scripts/check_lang_switcher_consistency.py --ci

      # z255xx: JA/PT page で <div class="breadcrumb"> last crumb の EN 残留 catch
      # 旧: 1,593 page で breadcrumb が EN のまま (h1 は翻訳済) — 視覚 locale 不整合
      # (z255xx fix_breadcrumb_locale_drift.py で h1 と sync)
      - name: Check breadcrumb locale drift
        id: breadcrumb_locale
        run: python3 scripts/check_breadcrumb_locale_drift.py --ci

      # z255zz: <h1> に '| BJJ Wiki' brand suffix 混入 catch (SEO keyword stuffing)
      # 旧: 115 PT page で h1='Guia de... | BJJ Wiki Brasil' (z255zz で fix)
      - name: Check h1 brand pollution
        id: h1_brand
        run: python3 scripts/check_h1_brand_pollution.py --ci

      # z255aaa:【BJJ】【BJJ】重複 prefix catch (translation double-stamp)
      # 旧: 188 JA page で h1/breadcrumb/body に重複 (z255aaa で fix)
      - name: Check duplicate BJJ prefix
        id: dup_bjj_prefix
        run: python3 scripts/check_duplicate_bjj_prefix.py --ci

      # z255ddd: External link で rel="noopener" のみ (noreferrer 不在) catch
      # 旧: 14,073 件 / 4,371 page で referrer leak (privacy 問題、z255ddd で fix)
      - name: Check external link noreferrer
        id: ext_noreferrer
        run: python3 scripts/check_external_link_noreferrer.py --ci

      # z255ggg: 同 page で <h2>FAQ heading</h2> 重複 catch (UX/a11y)
      # 旧: 3,980 page で <h2>Frequently Asked Questions</h2> が 2 回 (z255ggg で fix)
      - name: Check duplicate FAQ heading
        id: dup_faq
        run: python3 scripts/check_duplicate_faq_heading.py --ci

      # z255hhh: JSON-LD Article.url ≠ canonical catch (SEO rich snippet 帰属先曖昧化)
      # 旧: 883 page で url drift (root URL or no .html suffix) → z255hhh で fix
      - name: Check JSON-LD url drift
        id: jsonld_url
        run: python3 scripts/check_jsonld_url_drift.py --ci

      # z255jjj: body <a> で same-locale internal link が absolute URL (perf+lang switch UX)
      # 旧: 33 page / 99 link で <a href="https://wiki.bjj-app.net/<lang>/X.html"> → relative に変換
      - name: Check internal link relative URL
        id: internal_rel
        run: python3 scripts/check_internal_link_relative.py --ci

      # z255lll: twitter:image ≠ og:image catch (SNS preview Twitter 不整合)
      # 旧: 4,244 page で twitter:image=old static og-image.png、og:image=dynamic technique card
      # → Twitter preview だけ generic、Facebook/LinkedIn は technique-specific = 不整合 fix
      - name: Check twitter:image sync with og:image
        id: tw_img_sync
        run: python3 scripts/check_twitter_image_sync.py --ci

      # z255nnn: <meta name="keywords"> 残留 catch (Google 2009 から ignore、bloat 削減)
      # 旧: 2,813 page で残留 → z255nnn で削除
      - name: Check no obsolete meta keywords
        id: no_meta_keywords
        run: python3 scripts/check_no_meta_keywords.py --ci

      # z255sss: /login CTA に ?ref=wiki&page=X tracking 必須 (Wiki funnel attribution)
      # 旧: 4,094 page で /login CTA に ref param 不在 → wiki 経由 signup が direct 計上
      # → z255rrr Wiki funnel ROI が機能せず。z255sss で全 wiki page に tracking 追加
      - name: Check login CTA tracking
        id: login_cta_tracking
        run: python3 scripts/check_login_cta_tracking.py --ci

      # z255u: 同一 locale 内の <title> 衝突 (Google duplicate content 判定回避)
      - name: Check duplicate titles within locale
        id: dup_titles
        run: python3 scripts/check_duplicate_titles.py --ci

      # z255v: <a target=_blank> に rel=noopener 不在 (tabnabbing 攻撃 + Lighthouse 減点)
      - name: Check target=_blank security (rel=noopener)
        id: tab_security
        run: python3 scripts/check_target_blank_security.py --ci

      # z255w: 同 locale 内の <meta description> 衝突 (Google duplicate content 判定回避)
      - name: Check duplicate meta description within locale
        id: dup_meta
        run: python3 scripts/check_duplicate_meta_desc.py --ci

      # z255x: title 内の brand suffix 重複 (— BJJ Wiki | BJJ Wiki 等の keyword stuffing 化)
      - name: Check brand suffix pollution
        id: brand_suffix
        run: python3 scripts/check_brand_suffix_pollution.py --ci

      # z255y: bjj-app.net CTA は必ず /login?ref=wiki funnel tracking 経由
      - name: Check funnel CTA tracking (no naked href)
        id: funnel_cta
        run: python3 scripts/check_naked_bjj_app_cta.py --ci

      # z255z: ページ内アンカー fragment 死活検査 (#X が同ページ id="X" を持つこと)
      - name: Check in-page anchor fragments
        id: anchors
        run: python3 scripts/check_broken_anchors.py --ci

      # z255aa: <meta description> 内 unescaped `"` 検査 (HTML attribute truncation 防止)
      - name: Check meta attribute quote escaping
        id: meta_quotes
        run: python3 scripts/check_meta_attribute_quotes.py --ci

      # z255bb: form action endpoint misroute / email exposure 検査
      - name: Check form action endpoints (misroute / email exposure)
        id: form_endpoints
        run: python3 scripts/check_misrouted_form_endpoints.py --ci

      # z255ll: title/h1/og:title 内の同 case 単語連続 (Guide Guide 等)
      - name: Check duplicate word in title
        id: dup_words
        run: python3 scripts/check_duplicate_word_in_title.py --ci

      # z255kk: <title> 内 inline HTML element (<strong>/<span>等) 混入 (SEO scraper truncation)
      - name: Check title for embedded HTML tags
        id: title_html_tags
        run: python3 scripts/check_title_html_tags.py --ci

      # z255ll: JA/PT page で nav `>App</a>` / cta `>Start Free →</a>` 等英語残留 (locale drift)
      - name: Check CTA text locale drift
        id: cta_text_locale
        run: python3 scripts/check_cta_text_locale_drift.py --ci

      # z260w: meta description quality 4 classes (locale drift / PT athlete concat / length / about-privacy)
      - name: Check meta description quality
        id: description_quality
        run: python3 scripts/check_description_quality.py --ci

      # z260x: auto-toc が wiki-sidebar の h2 id を破壊する pattern 検出
      - name: Check h2 id clobber (TOC anchor regression)
        id: h2_id_clobber
        run: python3 scripts/check_h2_id_clobber.py --ci

      # z261f: HTML hardcoded z-index (allowlist 2 / 999 z243-float / 9999) outside check
      - name: Check z-index hardcode in HTML (stacking layer integrity)
        id: zindex_hardcode
        run: python3 scripts/check_zindex_hardcode_in_html.py --ci

      - name: Notify Telegram on Critical
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🔴 bjj-wiki: GHA regression detected ($(date '+%Y-%m-%d %H:%M')) — 先祖返りが発生。generate.yml 実行前に修正が必要。"
