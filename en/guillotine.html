<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0;url=guillotine-choke.html"><link rel="canonical" href="guillotine-choke.html"></head><body><a href="guillotine-choke.html">Redirecting...</a><div id="float-cta" style="position:fixed;bottom:20px;right:20px;max-width:280px;background:#0d2010;border:1px solid #2e7d32;border-radius:14px;padding:16px 18px;box-shadow:0 4px 20px rgba(0,200,83,.15);z-index:999;display:none;animation:slideUp .3s ease"><button onclick="document.getElementById('float-cta').style.display='none';localStorage.setItem('cta_dismissed','1')" style="position:absolute;top:8px;right:12px;background:none;border:none;color:#546e7a;font-size:1rem;cursor:pointer;line-height:1">✕</button><div style="font-weight:700;color:#a5d6a7;margin-bottom:6px;font-size:.9rem">📱 Track Your BJJ Training</div><p style="font-size:.8rem;color:#c8e6c9;margin:0 0 12px">Log sessions & techniques. Build your streak. Free.</p><a href="https://bjj-app.net/login" style="display:block;background:#10B981;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.85rem;text-align:center">Start Free →</a></div>
<script>
(function(){
  if(localStorage.getItem('cta_dismissed')) return;
  var el=document.getElementById('float-cta');
  var shown=false;
  function show(){if(!shown){shown=true;el.style.display='block';}}
  setTimeout(show,30000);
  window.addEventListener('scroll',function(){if((window.scrollY/(document.body.scrollHeight-window.innerHeight))>.5)show();},{passive:true});
})();
</script>
  <button id="back-to-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
  (function(){
    var prog=document.getElementById('read-progress');
    var btn=document.getElementById('back-to-top');
    window.addEventListener('scroll',function(){
      var scrolled=window.scrollY;
      var total=document.body.scrollHeight-window.innerHeight;
      if(total>0){prog.style.width=(scrolled/total*100)+'%';}
      if(scrolled>300){btn.style.display='flex';}else{btn.style.display='none';}
    },{passive:true});
    var headings=document.querySelectorAll('h2');
    if(headings.length>=3){
      var tocEl=document.getElementById('toc');
      var listEl=document.getElementById('toc-list');
      if(tocEl&&listEl){
        headings.forEach(function(h,i){
          var id='section-'+i;
          h.id=id;
          var li=document.createElement('li');
          var a=document.createElement('a');
          a.href='#'+id;
          a.textContent=h.textContent;
          li.appendChild(a);
          listEl.appendChild(li);
        });
        tocEl.style.display='block';
      }
    }
  })();
  </script>

<script>
(function(){
  if(window.innerWidth<1200)return;
  var hs=document.querySelectorAll('.container h2');
  if(hs.length<2)return;
  // assign IDs
  hs.forEach(function(h,i){if(!h.id)h.id='hs'+i;});
  // build sidebar
  var sb=document.createElement('nav');
  sb.className='wiki-sidebar';
  var logo=document.createElement('div');
  logo.className='wiki-sidebar-logo';
  logo.innerHTML='BJJ<span>Wiki</span>';
  sb.appendChild(logo);
  var ttl=document.createElement('div');
  ttl.className='wiki-sidebar-title';
  ttl.textContent='On This Page';
  sb.appendChild(ttl);
  var links=[];
  hs.forEach(function(h){
    var a=document.createElement('a');
    a.className='wiki-toc-link';
    a.href='#'+h.id;
    a.textContent=h.textContent.replace(/^[\s\u200b]+/,'');
    sb.appendChild(a);
    links.push(a);
  });
  document.body.appendChild(sb);
  // IntersectionObserver
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){l.classList.remove('active');});
          var al=sb.querySelector('a[href="#'+e.target.id+'"]');
          if(al)al.classList.add('active');
        }
      });
    },{rootMargin:'-15% 0px -75% 0px'});
    hs.forEach(function(h){io.observe(h);});
  }
})();
</script>

</body></html>
