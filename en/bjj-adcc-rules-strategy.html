<h1>Adcc Rules Strategy</h1><p>Learn about Adcc Rules Strategy in Brazilian Jiu-Jitsu.</p><footer style="margin-top:40px;padding-top:20px;border-top:1px solid #1e1e2e;text-align:center;color:#999">&copy; 2026 BJJ Wiki</footer>  <button id="back-to-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
  (function(){
    var prog=document.getElementById('read-progress');
    var btn=document.getElementById('back-to-top');
    window.addEventListener('scroll',function(){
      var scrolled=window.scrollY;
      var total=document.body.scrollHeight-window.innerHeight;
      if(total>0){prog.style.width=(scrolled/total*100)+'%';}
      if(scrolled>300){btn.style.display='flex';}else{btn.style.display='none';}
    },{passive:true});
    var headings=document.querySelectorAll('h2');
    if(headings.length>=3){
      var tocEl=document.getElementById('toc');
      var listEl=document.getElementById('toc-list');
      if(tocEl&&listEl){
        headings.forEach(function(h,i){
          var id='section-'+i;
          h.id=id;
          var li=document.createElement('li');
          var a=document.createElement('a');
          a.href='#'+id;
          a.textContent=h.textContent;
          li.appendChild(a);
          listEl.appendChild(li);
        });
        tocEl.style.display='block';
      }
    }
  })();
  </script>

<script>
(function(){
  if(window.innerWidth<1200)return;
  var hs=document.querySelectorAll('.container h2');
  if(hs.length<2)return;
  // assign IDs
  hs.forEach(function(h,i){if(!h.id)h.id='hs'+i;});
  // build sidebar
  var sb=document.createElement('nav');
  sb.className='wiki-sidebar';
  var logo=document.createElement('div');
  logo.className='wiki-sidebar-logo';
  logo.innerHTML='BJJ<span>Wiki</span>';
  sb.appendChild(logo);
  var ttl=document.createElement('div');
  ttl.className='wiki-sidebar-title';
  ttl.textContent='On This Page';
  sb.appendChild(ttl);
  var links=[];
  hs.forEach(function(h){
    var a=document.createElement('a');
    a.className='wiki-toc-link';
    a.href='#'+h.id;
    a.textContent=h.textContent.replace(/^[\s\u200b]+/,'');
    sb.appendChild(a);
    links.push(a);
  });
  document.body.appendChild(sb);
  // IntersectionObserver
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){l.classList.remove('active');});
          var al=sb.querySelector('a[href="#'+e.target.id+'"]');
          if(al)al.classList.add('active');
        }
      });
    },{rootMargin:'-15% 0px -75% 0px'});
    hs.forEach(function(h){io.observe(h);});
  }
})();
</script>
