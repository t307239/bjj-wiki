<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Decorative circles (no filters needed) -->
  <circle cx="100" cy="80" r="200" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="1100" cy="550" r="180" fill="#6366f1" opacity="0.08"/>
  <circle cx="600" cy="315" r="250" fill="#7c3aed" opacity="0.04"/>

  <!-- Left decoration: Belt bars -->
  <g transform="translate(70, 160)">
    <rect x="0" y="0" width="8" height="260" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="16" y="25" width="8" height="210" rx="4" fill="#3b82f6" opacity="0.5"/>
    <rect x="32" y="50" width="8" height="160" rx="4" fill="#8b5cf6" opacity="0.65"/>
    <rect x="48" y="75" width="8" height="110" rx="4" fill="#a16207" opacity="0.55"/>
    <rect x="64" y="100" width="8" height="60" rx="4" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- Right decoration: Technique tree nodes -->
  <g transform="translate(920, 100)" opacity="0.18" stroke="#a78bfa" stroke-width="2" fill="#a78bfa">
    <line x1="100" y1="60" x2="50" y2="140" fill="none"/>
    <line x1="100" y1="60" x2="150" y2="140" fill="none"/>
    <line x1="100" y1="60" x2="100" y2="150" fill="none"/>
    <line x1="50" y1="140" x2="20" y2="230" fill="none"/>
    <line x1="50" y1="140" x2="80" y2="230" fill="none"/>
    <line x1="150" y1="140" x2="120" y2="230" fill="none"/>
    <line x1="150" y1="140" x2="180" y2="230" fill="none"/>
    <line x1="100" y1="150" x2="100" y2="240" fill="none"/>
    <line x1="20" y1="230" x2="0" y2="310" fill="none"/>
    <line x1="80" y1="230" x2="60" y2="310" fill="none"/>
    <line x1="180" y1="230" x2="200" y2="310" fill="none"/>
    <circle cx="100" cy="60" r="12"/>
    <circle cx="50" cy="140" r="10"/>
    <circle cx="150" cy="140" r="10"/>
    <circle cx="100" cy="150" r="8"/>
    <circle cx="20" cy="230" r="7"/>
    <circle cx="80" cy="230" r="7"/>
    <circle cx="120" cy="230" r="7"/>
    <circle cx="180" cy="230" r="7"/>
    <circle cx="100" cy="240" r="6"/>
    <circle cx="0" cy="310" r="5"/>
    <circle cx="60" cy="310" r="5"/>
    <circle cx="200" cy="310" r="5"/>
  </g>

  <!-- "THE WORLD'S LARGEST" label -->
  <text x="600" y="180" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a78bfa" letter-spacing="8" text-anchor="middle">THE WORLD'S LARGEST</text>

  <!-- Main title: BJJ Wiki -->
  <text x="520" y="300" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="128" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="-2">BJJ</text>
  <text x="535" y="300" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="128" font-weight="900" fill="#a78bfa" text-anchor="start" letter-spacing="-2">Wiki</text>

  <!-- Divider line -->
  <rect x="350" y="318" width="500" height="4" rx="2" fill="url(#accent)" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="600" y="370" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#cbd5e1" letter-spacing="2" text-anchor="middle">Technique Encyclopedia &amp; Training Resource</text>

  <!-- Stats boxes -->
  <rect x="220" y="410" width="210" height="72" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="325" y="445" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">4,600+</text>
  <text x="325" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PAGES</text>

  <rect x="495" y="410" width="210" height="72" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="600" y="445" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
  <text x="600" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">LANGUAGES</text>

  <rect x="770" y="410" width="210" height="72" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="875" y="445" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">100%</text>
  <text x="875" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">FREE &amp; OPEN</text>

  <!-- Green CTA-style URL -->
  <rect x="430" y="520" width="340" height="48" rx="24" fill="url(#green)"/>
  <text x="600" y="551" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">wiki.bjj-app.net</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
