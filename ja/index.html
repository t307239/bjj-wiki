<script>
// ---- Config ----
var POPULAR = [{s:"bjj-triangle-choke-guide",t:"\u30c8\u30e9\u30a4\u30a2\u30f3\u30b0\u30eb\u30c1\u30e7\u30fc\u30af",e:"⬛",c:"submission"},{s:"bjj-rear-naked-choke",t:"\u88f8\u7d5e\u3081\uff08RNC\uff09",e:"⬛",c:"submission"},{s:"bjj-armbar-guide",t:"\u8155\u5341\u5b57\u56fa\u3081",e:"⬛",c:"submission"},{s:"bjj-closed-guard-attacks",t:"\u30af\u30ed\u30fc\u30ba\u30c9\u30ac\u30fc\u30c9\u653b\u6483",e:"🔒",c:"guard"},{s:"bjj-guard-passing-concepts",t:"\u30ac\u30fc\u30c9\u30d1\u30b9\u57fa\u790e",e:"⚔️",c:"passing"},{s:"bjj-open-guard-mastery",t:"\u30aa\u30fc\u30d7\u30f3\u30ac\u30fc\u30c9\u5b8c\u5168\u7fd2\u5f97",e:"🌐",c:"guard"},{s:"bjj-leg-lock-system",t:"\u30ec\u30c3\u30b0\u30ed\u30c3\u30af\u30b7\u30b9\u30c6\u30e0",e:"🦵",c:"submission"},{s:"bjj-back-control-system",t:"\u30d0\u30c3\u30af\u30b3\u30f3\u30c8\u30ed\u30fc\u30eb",e:"🎯",c:"position"},{s:"bjj-competition-strategy",t:"\u7af6\u6280\u6226\u7565",e:"🏆",c:"concepts"},{s:"bjj-beginners-guide",t:"\u521d\u5fc3\u8005\u30ac\u30a4\u30c9",e:"🥋",c:"concepts"},{s:"bjj-drilling-guide",t:"\u30c9\u30ea\u30ea\u30f3\u30b0\u30ac\u30a4\u30c9",e:"🔁",c:"concepts"},{s:"bjj-flow-rolling",t:"\u30d5\u30ed\u30fc\u30ed\u30fc\u30ea\u30f3\u30b0",e:"🌊",c:"concepts"}];
var BELT = {"white": "白帯", "blue": "青帯", "purple": "紫帯", "brown": "茶帯", "black": "黒帯"};
var allData = null;
var filtered = [];
var shown = 0;
var PAGE = 24;
var activeCat = "all";
var searchQ = "";

// ---- Init ----
window.addEventListener('load', function() {
  renderCards(POPULAR.map(function(p){
    return {s:p.s,t:p.t,d:"",c:p.c,b:"white"};
  }), false);
  document.getElementById('results-count').textContent = "人気のガイド";
  // Lazy load search.json
  fetch('search.json').then(function(r){return r.json();}).then(function(data){
    allData = data;
  }).catch(function(){});
});

// ---- Search ----
function onSearch(q) {
  searchQ = q.trim().toLowerCase();
  if (!allData) {
    fetch('search.json').then(function(r){return r.json();}).then(function(data){
      allData = data;
      doFilter();
    });
  } else {
    doFilter();
  }
}

function filterCat(cat, el) {
  activeCat = cat;
  document.querySelectorAll('.cat-pill').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  if (!allData) {
    fetch('search.json').then(function(r){return r.json();}).then(function(data){
      allData = data;
      doFilter();
    });
  } else {
    doFilter();
  }
}

function doFilter() {
  var q = searchQ;
  var cat = activeCat;
  if (!allData) return;
  filtered = allData.filter(function(item) {
    var catOk = cat === "all" || item.c === cat;
    var qOk   = !q || item.t.toLowerCase().includes(q) || (item.d && item.d.toLowerCase().includes(q)) || item.s.includes(q.replace(/ /g,'-'));
    return catOk && qOk;
  });
  shown = 0;
  renderCards(filtered.slice(0, PAGE), true);
  shown = Math.min(PAGE, filtered.length);
  document.getElementById('results-count').textContent = filtered.length + " results";
  document.getElementById('no-results').style.display = filtered.length ? 'none' : '';
  document.getElementById('load-more-wrap').style.display = filtered.length > PAGE ? '' : 'none';
}

function loadMore() {
  var next = filtered.slice(shown, shown + PAGE);
  appendCards(next);
  shown += next.length;
  if (shown >= filtered.length) {
    document.getElementById('load-more-wrap').style.display = 'none';
  }
}

function renderCards(items, clear) {
  var grid = document.getElementById('results-grid');
  if (clear) grid.innerHTML = '';
  appendCards(items);
}

function appendCards(items) {
  var grid = document.getElementById('results-grid');
  var html = '';
  items.forEach(function(item) {
    var slug = item.s || item.slug || '';
    var title = item.t || item.title || slug;
    var desc = item.d || item.desc || '';
    var belt = BELT[item.b] || BELT['white'] || '';
    html += '<div class="result-title">' + esc(title) + '</div>';
    if (desc) html += '<div class="result-desc">' + esc(desc) + '</div>';
    html += '<div class="result-meta"><span class="badge">' + esc(belt) + '</span></div>';
    html += '</a>';
  });
  grid.innerHTML += html;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
