<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1425"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7c6af7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c6af7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow orbs (centered) -->
  <ellipse cx="400" cy="315" rx="300" ry="200" fill="#7c6af7" opacity="0.06" filter="url(#blur)"/>
  <ellipse cx="800" cy="315" rx="300" ry="200" fill="#c084fc" opacity="0.04" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Belt stripe decoration (left of center) -->
  <g transform="translate(170, 0)">
    <rect x="0" y="200" width="5" height="230" rx="2.5" fill="#ffffff" opacity="0.06"/>
    <rect x="10" y="230" width="5" height="170" rx="2.5" fill="#3b82f6" opacity="0.4"/>
    <rect x="20" y="255" width="5" height="120" rx="2.5" fill="#7c6af7" opacity="0.6"/>
    <rect x="30" y="275" width="5" height="80" rx="2.5" fill="#c084fc" opacity="0.7"/>
  </g>

  <!-- BJJ Figure silhouette — guard position (right side, pulled inward) -->
  <g transform="translate(750, 140)" opacity="0.08">
    <!-- Bottom player (guard) -->
    <ellipse cx="120" cy="340" rx="70" ry="22" fill="#7c6af7"/>
    <rect x="85" y="230" width="70" height="110" rx="18" fill="#7c6af7"/>
    <ellipse cx="120" cy="225" rx="30" ry="35" fill="#7c6af7"/>
    <!-- Legs up -->
    <line x1="120" y1="285" x2="55" y2="175" stroke="#7c6af7" stroke-width="24" stroke-linecap="round"/>
    <line x1="120" y1="285" x2="195" y2="185" stroke="#7c6af7" stroke-width="24" stroke-linecap="round"/>
    <!-- Top player (inside guard) -->
    <ellipse cx="120" cy="150" rx="26" ry="30" fill="#a78bfa"/>
    <rect x="95" y="175" width="50" height="80" rx="13" fill="#a78bfa"/>
    <line x1="95" y1="200" x2="50" y2="235" stroke="#a78bfa" stroke-width="18" stroke-linecap="round"/>
    <line x1="145" y1="200" x2="195" y2="240" stroke="#a78bfa" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- === MAIN CONTENT (centered in safe zone) === -->

  <!-- Label: BRAZILIAN JIU-JITSU -->
  <text x="600" y="210" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#7c6af7" letter-spacing="6" opacity="0.9" text-anchor="middle">BRAZILIAN JIU-JITSU</text>

  <!-- Main title: BJJ Wiki -->
  <text x="600" y="320" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-2" text-anchor="middle">BJJ
    <tspan fill="url(#accent)"> Wiki</tspan>
  </text>

  <!-- Divider -->
  <rect x="460" y="350" width="280" height="3" rx="2" fill="url(#accent)" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="'Arial', sans-serif" font-size="22" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Technique Encyclopedia &amp; Training Resource</text>

  <!-- Stats row (centered) -->
  <g>
    <text x="398" y="465" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">4,600+</text>
    <text x="398" y="487" font-family="'Arial', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Pages</text>

    <text x="600" y="465" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="600" y="487" font-family="'Arial', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Languages</text>

    <text x="802" y="465" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">100%</text>
    <text x="802" y="487" font-family="'Arial', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Free &amp; Open</text>
  </g>

  <!-- Dot separators -->
  <circle cx="498" cy="475" r="3" fill="#7c6af7" opacity="0.5"/>
  <circle cx="702" cy="475" r="3" fill="#7c6af7" opacity="0.5"/>

  <!-- URL badge (centered) -->
  <rect x="491" y="520" width="218" height="34" rx="17" fill="#7c6af7" opacity="0.15" stroke="#7c6af7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="543" font-family="'Arial', sans-serif" font-size="15" fill="#a78bfa" text-anchor="middle" letter-spacing="0.5">wiki.bjj-app.net</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
