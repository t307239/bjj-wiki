    ja: "ベリンボロ — スポーツ柔術で最もコピーされたバックテイク"
    pt: "Berimbolo — O sistema de pegada das costas mais copiado"
  - slug: imanari-roll
    en: "Imanari Roll — The spinning leg-lock entry that opened a meta"
    ja: "イマナリロール — メタを開いた回転式レッグロック入り"
    pt: "Imanari Roll — A entrada giratória de chave de perna"
  - slug: triangle-choke
    en: "Triangle Choke — Why Royce Gracie's UFC weapon still wins"
    ja: "三角絞め — ホイス・グレイシーの UFC 武器が今も勝つ理由"
    pt: "Triângulo — Por que a arma de Royce Gracie no UFC ainda vence"
  - slug: kimura
    en: "Kimura — The grip that defeated Helio and never went out of style"
    ja: "キムラ — エリオを破ったグリップ、廃れない理由"
    pt: "Kimura — A pegada que venceu Helio e nunca saiu de moda"
  - slug: x-guard
    en: "X-Guard — Marcelo Garcia's invention that reshaped sweeps"
    ja: "Xガード — マルセロ・ガルシアの発明とスイープ革命"
    pt: "X-Guard — A invenção de Marcelo Garcia que mudou as raspagens"
  - slug: 50-50-guard
    en: "50/50 Guard — Mendes brothers' geometry of leg entanglement"
    ja: "50/50ガード — メンデス兄弟による下半身絡みの幾何学"
    pt: "50/50 Guard — A geometria dos irmãos Mendes nos enroscos de pernas"
  - slug: rear-naked-choke
    en: "Rear Naked Choke — The most-finished submission in MMA history"
    ja: "リアネイキッドチョーク — MMA 史上最も決まったサブミッション"
    pt: "Mata-Leão — A finalização mais decisiva da história do MMA"
  - slug: butterfly-guard
    en: "Butterfly Guard — Marcelo Garcia's no-gi sweep encyclopedia"
    ja: "バタフライガード — マルセロ・ガルシアのノーギ・スイープ百科"
    pt: "Butterfly Guard — A enciclopédia de raspagens no-gi de Marcelo"
  - slug: de-la-riva-guard
    en: "De La Riva Guard — The hook that opened sport-BJJ's open guard era"
    ja: "デラヒーバガード — スポーツ柔術オープンガード時代を開いたフック"
    pt: "Guarda De La Riva — O gancho que abriu a era da guarda aberta esportiva"
  - slug: deep-half-guard
    en: "Deep Half Guard — Jeff Glover's underhook-driven sweep system"
    ja: "ディープハーフガード — ジェフ・グローバーのアンダーフック・スイープ"
    pt: "Deep Half Guard — O sistema de raspagens de Jeff Glover"
  - slug: armbar
    en: "Armbar — The first submission every white belt should master"
    ja: "アームバー — 全ての白帯が最初に覚えるべきサブミッション"
    pt: "Armbar — A primeira finalização que todo faixa branca deve dominar"

