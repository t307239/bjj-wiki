# news_feed.yml — Wave WW (G): /news page weekly auto-update source
#
# This file is the SOURCE OF TRUTH for the /news page across 3 locales.
# Update manually when real BJJ events / wiki milestones occur, then
# `python3 scripts/generate_news_page.py` regenerates en/ja/pt news.html.
#
# Cron: .github/workflows/news_weekly.yml runs every Monday 09:00 JST and
# bumps the "week_of" date + rotates the featured_techniques pool. This
# gives Google a freshness signal even if no manual updates happen.
#
# Honesty note: do NOT fabricate events. Only list real BJJ tournaments
# and wiki additions. If unsure, omit. The "featured" pool is curated
# evergreen content that's safe to rotate.

# Permanent featured pool — pages cycled through over weeks.
# Generator picks `(week_of_year % len(pool))..+3` items each run.
featured_techniques:
  - slug: heel-hook
    en: "Heel Hook — The defining submission of modern no-gi"
    ja: "ヒールフック — モダンノーギを定義するサブミッション"
    pt: "Heel Hook — A submissão que define o no-gi moderno"
  - slug: berimbolo
