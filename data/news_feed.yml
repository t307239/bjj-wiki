  - slug: de-la-riva-guard
    en: "De La Riva Guard — The hook that opened sport-BJJ's open guard era"
    ja: "デラヒーバガード — スポーツ柔術オープンガード時代を開いたフック"
    pt: "Guarda De La Riva — O gancho que abriu a era da guarda aberta esportiva"
  - slug: deep-half-guard
    en: "Deep Half Guard — Jeff Glover's underhook-driven sweep system"
    ja: "ディープハーフガード — ジェフ・グローバーのアンダーフック・スイープ"
